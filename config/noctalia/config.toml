[theme]
mode = "dark"
source = "builtin"
builtin = "Gruvbox"

[shell]
font_family = "ComicShannsMono Nerd Font"
time_format = "{:%H:%M}"
date_format = "%A, %x"
panel_anchor_bar = "main"

[shell.screenshot]
save_to_file = true
directory = "/home/erfan/Pictures/Screenshots"
copy_to_clipboard = true
freeze_screen = true
annotate = true

[bar]
order = ["main", "bottom"]

[bar.main]
position = "top"
background_opacity = 0.90
compositor_blur = true
radius = 10
margin_ends = 300
widget_spacing = 16
padding = 18
start  = ["launcher", "workspaces", "network", "media"]
center = ["active_window", "notifications"]
end    = ["tray", "volume", "brightness", "keyboard_layout", "clock", "battery", "control-center", "session"]

[bar.bottom]
position           = "bottom"
layer              = "overlay"
reserve_space      = false
thickness          = 26
background_opacity = 0.90
compositor_blur    = true
radius             = 12
margin_ends        = 1000
padding            = 14
widget_spacing     = 12
start = []
center = ["cpu", "ram", "audio_visualizer", "net_rx", "net_tx"]
end = []

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "gauge"

[widget.ram]
type = "sysmon"
stat = "ram_pct"
visualization = "gauge"

[widget.net_rx]
type = "sysmon"
stat = "net_rx"
network_speed_compact = true

[widget.net_tx]
type = "sysmon"
stat = "net_tx"
network_speed_compact = true

[notification]
enable_daemon = true
position = "top_center"
width = 420
background_opacity = 0.97
border = true
max_visible = 5

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = true

[idle.behavior.monitor_off]
timeout = 660
action = "screen_off"
enabled = true

[wallpaper]
enabled = true
fill_mode = "stretch"

[wallpaper.default]
path = "/home/erfan/.config/wallpaper/damavand-sunset.jpg"

[backdrop]
enabled = true

[system.monitor]
enabled = true

[weather]
enabled = true
refresh_minutes = 30
unit = "metric"
effects = true

[location]
address = "Tehran, Iran"

[desktop_widgets]
enabled = true
schema_version = 2
widget_order = ["audio_top"]

# top-center visualizer, no background
[desktop_widgets.widget.audio_top]
type = "audio_visualizer"
output = "HDMI-A-1"
cx = 1200.0
cy = 210.0
box_width = 600.0
box_height = 120.0

[desktop_widgets.widget.audio_top.settings]
background = false
bands = 32
mirrored = true
centered = true
show_when_idle = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = ["lockscreen-login-box@HDMI-A-1", "lockscreen-clock@HDMI-A-1", "lockscreen-visualizer@HDMI-A-1"]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    type = "login_box"
    output = "HDMI-A-1"
    cx = 1200.0
    cy = 1168.0
    box_width = 810.0
    box_height = 196.0
    placement_width = 2400.0
    placement_height = 1350.0
    rotation = 0.0
    enabled = true

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-clock@HDMI-A-1"]
    type = "clock"
    output = "HDMI-A-1"
    cx = 1200.0
    cy = 200.0
    box_width = 500.0
    box_height = 160.0
    placement_width = 2400.0
    placement_height = 1350.0
    rotation = 0.0
    enabled = true

        [lockscreen_widgets.widget."lockscreen-clock@HDMI-A-1".settings]
        background = false
        clock_style = "digital"
        format = "{:%H:%M}"
        center_text = true
        color = "on_surface"
        shadow = true

    [lockscreen_widgets.widget."lockscreen-visualizer@HDMI-A-1"]
    type = "audio_visualizer"
    output = "HDMI-A-1"
    cx = 1200.0
    cy = 620.0
    box_width = 600.0
    box_height = 120.0
    placement_width = 2400.0
    placement_height = 1350.0
    rotation = 0.0
    enabled = true

        [lockscreen_widgets.widget."lockscreen-visualizer@HDMI-A-1".settings]
        background = false
        bands = 32
        mirrored = true
        centered = true
        show_when_idle = true
